[package]
name = "diagram-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Command-line interface for diagram."

[[bin]]
name = "diagram"
path = "src/main.rs"

[dependencies]
diagram-core.workspace = true
diagram-symbols-schematic.workspace = true
diagram-symbols-dataflow.workspace = true
diagram-symbols-shapes.workspace = true
clap = { version = "4.5.61", features = ["derive"] }
serde_json = "1.0.150"
flate2 = "1"
indicatif = "0.17"
tar = "0.4"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate-miniz"] }

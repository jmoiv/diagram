name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: diagram
            archive: linux-x86_64.tar.gz

          - label: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            exe: diagram
            archive: linux-aarch64.tar.gz

          - label: macos-x86_64
            runner: macos-13
            target: x86_64-apple-darwin
            exe: diagram
            archive: macos-x86_64.tar.gz

          - label: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            exe: diagram
            archive: macos-aarch64.tar.gz

          - label: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            exe: diagram.exe
            archive: windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.label != 'windows-x86_64'
        run: |
          mkdir ${{ matrix.label }}
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} ${{ matrix.label }}/diagram
          tar czf ${{ matrix.archive }} ${{ matrix.label }}

      - name: Package (Windows)
        if: matrix.label == 'windows-x86_64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory ${{ matrix.label }}
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.exe }} ${{ matrix.label }}/diagram.exe
          Compress-Archive -Path ${{ matrix.label }} -DestinationPath ${{ matrix.archive }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

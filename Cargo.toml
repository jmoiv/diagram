[workspace]
resolver = "2"
members = [
    "crates/diagram-core",
    "crates/diagram-cli",
    "crates/diagram-symbols-schematic",
    "crates/diagram-symbols-dataflow",
    "crates/diagram-symbols-shapes",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.74"
license = "Apache-2.0"
repository = "https://github.com/jmoiv/diagram"
authors = ["diagram contributors"]

[workspace.dependencies]
diagram-core = { path = "crates/diagram-core" }
diagram-symbols-schematic = { path = "crates/diagram-symbols-schematic" }
diagram-symbols-dataflow = { path = "crates/diagram-symbols-dataflow" }
diagram-symbols-shapes = { path = "crates/diagram-symbols-shapes" }

[profile.release]
# Diagrams are small; favor a smaller, reasonably fast binary.
opt-level = 2
